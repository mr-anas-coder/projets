<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulaire Location Voiture</title>
</head>
<body bgcolor="yellow">
	<header>
		<h1>Formulaire Location Voiture</h1>
	</header>

	<section>
		<form action="#" method="post">
			<table>
				<tr>
					<td><label for="immatriculation">Immatriculation :</label></td>
		            <td><input type="text" id="immatriculation" name="immatricumlation"></td>
				</tr>
				<tr>
					<td><label for="date_immatriculation">Date d'immatriculation :</label></td>
					<td><input type="date" id="date_immatriculation" name="date_immatriculation"><br/></td>
				</tr>
				<tr>
					<td><label for="couleur">Couleur :</label></td>
		            <td><input type="text" id="couleur" name="couleur"><br/></td>
				</tr>
				<tr>
					<td><label for="kilometrage">Kilométrage :</label></td>
					<td><input type="number" id="kilometrage" name="kilometrage"><br/></td>
				</tr>
				<tr>
					<td><label for="marque">Marques :</label></td>
					<td><select id="marque" name="marque">
						<option value="peugeot">Peugeot</option>
						<option value="mercedes">Merceds</option>
						<option value="renault">Renault</option>
					</select></td>
				</tr>
				<tr>
					<td>
						<label for="hybride">Hybride :</label>
					</td>
					<td>
                        <input type="radio" id="electrique" name="carburant" value="electrique">
                        <label for="electrique">Electrique</label>
                        <input type="radio" id="diesel" name="carburant" value="diesel">
                        <label for="diesel">Diesel</label>
                        <input type="radio" id="essence" name="carburant" value="essence">
                        <label for="essence">Essence</label>
                    </td> 
				</tr>
				<tr>
					<td>
						<label for="boite_vitesse">Boite de vitesse :</label>
					</td>
					<td>
                        <input type="radio" id="manuelle" name="boite_vitesse" value="manuelle">
                        <label for="manuelle">Manuelle</label>
                        <input type="radio" id="automatique" name="boite_vitesse" value="automatique">
                        <label for="automatique">Automatique</label>
                    </td>
				</tr>
				<tr>
					<td><label for="nombres_portes">Nombre de portes :</label></td>
					<td><input type="text" id="nombres_portes" name="nombres_portes"><br/></td>
				</tr>
			</table>

		    <button type="submit">Enregistrer</button>
		    <button type="reset">Annuler</button>
	    </form>
	</section>

</body>
</html>
