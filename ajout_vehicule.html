<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulaire Location Voiture</title>
</head>
<body bgcolor="yellow">
	<header>
		<h1>Formulaire Location Voiture</h1>
	</header>

	<section>
		<form action="#" method="post">
		    <label for="immatriculation">Immatriculation :</label>
		    <input type="text" id="immatriculation" name="immatricumlation">
		    <label for="date_immatriculation">Date d'immatriculation :</label>
		    <input type="date" id="date_immatriculation" name="date_immatriculation"><br/>
		    <label for="couleur">Couleur :</label>
		    <input type="text" id="couleur" name="couleur"><br/>
		    <label for="kilometrage">Kilométrage :</label>
		    <input type="number" id="kilometrage" name="kilometrage"><br/>
		    <label for="marque">Marques :</label>
		       <select id="marque" name="marque">
			        <option value="peugeot">Peugeot</option>
			        <option value="mercedes">Merceds</option>
			        <option value="renault">Renault</option>
		        </select>
		    <br/>
		    <label for="hybride">Hybride :</label>
		    <input type="radio" id="carburant" name="carburant">
		    <label for="electrique">Electrique</label>
		    <input type="radio" id="electrique" name="electrique">
		    <label for="diesel">Diesel</label>
		    <input type="radio" id="diesel" name="diesel">
		    <label for="essence">Essence</label>
		    <input type="radio" id="ensence" name="ensence"><br/>
		    <label for="boite_vitesse">Boite de vitesse :</label>
		    <input type="radio" id="manuelle" name="manuelle">
		    <label for="manuelle">Manuelle</label>
		    <input type="radio" id="automatique" name="automatique">
		    <label for="automatique">Automatique</label><br/>
		    <label for="nombres_portes">Nombre de portes :</label>
		    <input type="text" id="nombres_portes" name="nombres_portes"><br/>

		    <button type="submit">Enregistrer</button>
		    <button type="reset">Annuler</button>
	    </form>
	</section>

</body>
</html>
