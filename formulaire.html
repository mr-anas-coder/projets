 <!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription Nouveau Client - Méditerannée</title>
</head>
<body bgcolor="yellow">
	<header>
		<h1>Inscription d'un nouveau client</h1>
	</header>

	<section>
		<form action="#" method="post">
		    <label for="nom">Nom :</label>
		    <input type="text" id="nom" name="nom"><br/>
		    <label for="prenom">Prenom :</label>
		    <input type="text" id="prenom" name="prenom"><br/>
		    <label for="date_naissance">Date de naissance :</label>
		    <input type="date" id="date_naissance" name="date_naissance"><br/>
		    <label for="email">Adresse mail: <br/>
		    <input type="email" id="email" name="email"><br/>
		    <label for="mdp">Mot de passe :</label>
		    <input type="password" id="mdp" name="mdp"><br/>
		    <label for="permis">Numéro de permis :</label>
		    <input type="text" id="permis" name="permis"><br/> 
		    <label for="ancienneté">Nombre d'année d'ancienneté :</label>
		    <input type="number" id="anciennete" name="anciennete" min="0" max="80">
		    <label for="ville">Ville :</label>
		       <select id="ville" name="ville">
			        <option value="paris">Paris</option>
			        <option value="creteil">Creteil</option>
			        <option value="versailles">Versailles</option>
		        </select>
		    <label for="adresse">Adresse du client :</label>
		    <textarea id="adresse" name="adresse" row="4" cols="30"></textarea><br/>

		    <p>Situation matrimoniale :</p>
		    <label for="marie_oui">Marié</label>
		    <input type="radio" id="marie_oui" name="marie" value="oui">
		    <label for="marie_non">Non marié</label>
		    <input type="radio" id="marie_non" name="marie" value="non"><br/>

		    <p>Préférence de voiture :</p>
		    <label for="pref_auto">Automatique</label>
		    <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
		    <label for="pref_manuelle">Manuelle</label>
		    <input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle"><br/>

		    <button type="submit">Enregistrer</button>
		    <button type="reset">Annuler</button>
	    </form>
	</section>

	<footer>
		<p>&copy; 2026 Agence Méditerannée - Location de véhicules</p>
	</footer>
</body>
</html>
